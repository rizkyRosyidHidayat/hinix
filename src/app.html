<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- open graphics -->
		<meta name="og:title" content="OS" />
		<meta name="og:description" content="Personal Operating System" />
		<meta name="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="OS" />
		<meta name="twitter:description" content="Personal Operating System" />
		<meta name="twitter:image" content="%sveltekit.assets%/favicon.ico" />
		<meta name="msapplication-TileColor" content="#38bdf8" />
		<meta name="msapplication-TileImage" content="%sveltekit.assets%/favicon.ico" />
		<meta name="theme-color" content="#38bdf8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.ico" />
		%sveltekit.head%
		<script>
			(function() {
				try {
					var theme = 'system';
					var match = document.cookie.match(/(?:^|; )hinix_theme=([^;]*)/);
					if (match) {
						theme = match[1];
					}
					if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
